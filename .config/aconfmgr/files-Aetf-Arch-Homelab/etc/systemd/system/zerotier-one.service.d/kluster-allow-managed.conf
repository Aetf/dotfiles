# The overlay's home routes are refused on this host (kluster ops#728,
# docs/physical/homelab-host.md §4): it sits on the home subnets and serves
# them, so its paths to the home stay on the LAN. The client reads the file
# when the network comes up and rewrites it with a boolean on any
# `zerotier-cli set` or repeated `join`, so the whitelist is put back before
# every start. Every other line of the file is kept.
[Service]
ExecStartPre=/bin/sh -c 'test -f /var/lib/zerotier-one/networks.d/83048a0632b6ba9b.local.conf || exit 0; sed -i "s|^allowManaged=.*|allowManaged=10.144.0.0/16|" /var/lib/zerotier-one/networks.d/83048a0632b6ba9b.local.conf; grep -qx allowManaged=10.144.0.0/16 /var/lib/zerotier-one/networks.d/83048a0632b6ba9b.local.conf || echo allowManaged=10.144.0.0/16 >> /var/lib/zerotier-one/networks.d/83048a0632b6ba9b.local.conf'
