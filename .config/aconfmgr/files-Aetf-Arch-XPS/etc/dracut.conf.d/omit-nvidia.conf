# Keep the NVIDIA modules out of the initramfs (hostonly probing pulls them
# in for the dGPU). With NVreg_PreserveVideoMemoryAllocations in effect, the
# driver's PM freeze callback only works when orchestrated through
# /proc/driver/nvidia/suspend by the nvidia-{suspend,hibernate,resume}
# services. Those don't exist in the initrd, so with the modules loaded there,
# resume-from-hibernation dies at the device-freeze step right after the image
# is read ("nv_pmops_freeze returns -5") and falls back to a fresh boot.
# The dGPU is not needed before switch-root; i915 drives the panel.
# Both hyphen and underscore spellings: dracut matches on-disk .ko file names
# (hyphens), module aliases use underscores.
omit_drivers+=" nvidia nvidia-drm nvidia-modeset nvidia-uvm nvidia-peermem nvidia_drm nvidia_modeset nvidia_uvm nvidia_peermem "
