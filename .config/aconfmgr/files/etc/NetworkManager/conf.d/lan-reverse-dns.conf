# LAN reverse-DNS routing domains for systemd-resolved.
#
# XPS uses NetworkManager, which feeds DNS to systemd-resolved. resolved
# excludes the RFC1918 reverse zones from the implicit "~." default route and
# synthesizes NXDOMAIN locally instead of forwarding upstream; nsswitch
# ("resolve [!UNAVAIL=return] ... dns") makes that final, so reverse lookups of
# home IPs (e.g. 192.168.90.237 -> rpi.iot.home.arpa) fail. homelab fixes this
# on its systemd-networkd link (Domains= in 15-wired.network); the NM-equivalent
# is a connection-default dns-search carrying the same route-only ("~") domains,
# so resolved forwards the home reverse zones to the active connection's DNS.
#
# XPS roams: harmless off-home (the zones just route to whatever DNS that
# network provides). Also needs the gw-side AdGuard IPv6 private-PTR fix to
# actually resolve (see home-network-architecture notes).
#
# UNVERIFIED on XPS (offline when written): after `aconfmgr apply`, confirm
# `resolvectl domain` lists these on the active link.
[connection]
ipv4.dns-search=~90.168.192.in-addr.arpa;~80.168.192.in-addr.arpa;~5.0.10.in-addr.arpa
ipv6.dns-search=~90.168.192.in-addr.arpa;~80.168.192.in-addr.arpa;~5.0.10.in-addr.arpa
