@version: 4.11
@include "scl.conf"

options {
    chain_hostnames(off);
    create_dirs(no);
    dns_cache(yes);
    flush_lines(0);
    group("log");
    # Ignore the in-message hostname (busybox syslogd forwards without one, so
    # container messages via /dev/log used to land in a bogus ":.log") and
    # instead key off the sender's address, reverse-resolved to a hostname.
    # ${FULLHOST} then becomes e.g. "rpi" (needs the RFC1918 reverse zones
    # routed to AdGuard on homelab — see 15-wired.network Domains=), falling
    # back to the raw IP if a sender has no PTR.
    keep_hostname(no);
    log_fifo_size(10000);
    perm(0640);
    # Directories created by create-dirs default to 0700 root:root; open
    # them to the log group so operators (and the resident agent) can read
    # without sudo.
    dir_group("log");
    dir_perm(0750);
    stats(freq(0));
    time_reopen(10);
    use_dns(yes);
    use_fqdn(no);
};


# 1. Sources
# Listen for incoming remote UDP logs from the Pi
source s_network {
    # busybox syslogd -R forwards RFC3164 without a hostname field. Without
    # this flag syslog-ng parses the first token after the timestamp as the
    # host, so an empty-ident message ("<ts> : msg" from musl syslog()/conmon)
    # puts a bare ":" in the host position and lands in a bogus ":.log". With
    # keep_hostname(no)+use_dns(yes) that even survives as ":" on a failed
    # reverse lookup. no-hostname tells the parser these messages carry no
    # host, so everything after the timestamp stays program+message and
    # ${FULLHOST} always comes from the sender (reverse-resolved name, else IP).
    default-network-drivers(flags(no-hostname));
};

# Capture syslog-ng's own operational logs (highly recommended for debugging)
source s_internal {
    internal();
};

# 2. Destinations
# Where to write the Pi's remote logs
destination d_remote {
    file("/var/log/remote/${FULLHOST}.log" create-dirs(yes));
};

# Where to write syslog-ng's internal logs
destination d_stdout {
    file("/dev/stdout");
};

# 3. Log Paths (Routing)
# Route the network traffic to the Pi log file
log {
    source(s_network);
    destination(d_remote);
};

# Route the internal engine traffic to stdout which is captured by
# systemd-journald
log {
    source(s_internal);
    destination(d_stdout);
};
