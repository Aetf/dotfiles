# Bind-mounted over the image's /etc/resolv.conf by nspawn/caddy.nspawn.
#
# The gateway's own dnsmasq, because it is the only resolver that answers both
# halves of what caddy asks: it is authoritative for home.arpa (the reverse
# proxy's upstreams are named aetf-arch-homelab.home.arpa, dmse.home.arpa,
# ups.home.arpa) and it forwards everything else, so ACME's calls to the
# Cloudflare API resolve too. It is not the AdGuard pair, so caddy still does
# not depend on what it fronts, and it runs on this same device.
#
# Exactly one entry: musl queries every listed nameserver in parallel and takes
# the first response, so a public resolver alongside this one would answer
# NXDOMAIN for home.arpa and win the race.
nameserver 10.0.5.1
