# State (AdGuardHome.yaml + data/) lives in /data/adguard on the host
# (bind-mounted via adguard.nspawn Bind=/data), NOT in the container rootfs:
# the rootfs is software-only so it can be wiped/replaced by image deploys.
[Service]
ExecStart=
ExecStart=/opt/AdGuardHome/AdGuardHome -s run -c /data/adguard/AdGuardHome.yaml -w /data/adguard
