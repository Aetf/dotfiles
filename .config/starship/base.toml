# Starship prompt, styled after the powerlevel10k lean config this replaced.
#
# This file is not read by starship directly:
# ~/.config/zsh/config.d/20-starship/config.zsh concatenates it with the
# fragments other configs register and points STARSHIP_CONFIG at the result.
# Keep top-level keys here; fragments may only add tables they own.
#
# Only the first line comes from starship. The prompt character on the second
# line is drawn by zsh so it can follow zsh-vi-mode without rerunning starship.

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

# Left: directory, the work fragment's CitC client (${env_var.STARSHIP_CITC},
# empty where unset), fragments' ${custom} modules, then VCS state last: it is
# computed in the background (config.d/20-starship/prompt-vcs.zsh) and appears
# after the first draw, which moves nothing else. Right, after the dotted
# filler: failed exit status, duration, jobs, language versions, fragments'
# ${env_var} modules, user@host (ssh/root only), vim :sh marker.
format = """ $directory\
${env_var.STARSHIP_CITC}${custom}${env_var.STARSHIP_VCS}\
$fill \
$status$cmd_duration$jobs\
$python$conda$nodejs$rust$golang$java$lua$ruby$perl$php$haskell$julia$elixir$erlang$dotnet$dart\
${env_var}\
$username$hostname\
"""

# The same line without python and the language modules. Those list the
# current directory, which on network filesystems is slow and overruns
# scan_timeout (starship then warns on stderr). starship renders only the
# modules its format names, so this profile never scans. Configs select it
# by setting starship_profile=nolang (config.d/20-starship/config.zsh).
# Keep in sync with format.
[profiles]
nolang = """ $directory\
${env_var.STARSHIP_CITC}${custom}${env_var.STARSHIP_VCS}\
$fill \
$status$cmd_duration$jobs\
$conda\
${env_var}\
$username$hostname\
"""

# VCS state, with its colors already applied
# (config.d/20-starship/prompt-vcs.zsh).
[env_var.STARSHIP_VCS]
format = '$env_value '

[fill]
symbol = '·'
style = 'fg:242'

[directory]
truncation_length = 100
truncate_to_repo = false
format = '[$path]($style)[$read_only]($read_only_style) '
repo_root_format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) '
style = 'fg:31'
before_repo_root_style = 'fg:31'
repo_root_style = 'bold fg:39'
read_only = " \uF023"

# Fragments append their own rules with [[directory.substitutions]]. TOML only
# lets later [[...]] blocks extend a key that is already an array of tables,
# and starship rejects an empty block, so this no-op rule holds the key.
# Add base rules here in the same form; an inline array would break fragments.
[[directory.substitutions]]
from = '^'
to = ''
regex = true

# Shown only for signals (`✘ INT`) and pipelines with a failed stage
# (`✘ 1|0`); a plain failure only turns the prompt character red.
# success_style colors a pipeline whose last stage succeeded.
[status]
disabled = false
format = '([✘ $signal_name]($style) )'
pipestatus = true
pipestatus_format = '[$symbol$pipestatus]($style) '
pipestatus_segment_format = '$status'
pipestatus_separator = '|'
symbol = '✘ '
style = 'fg:160'
success_style = 'fg:70'

[cmd_duration]
min_time = 3000
format = '[$duration]($style) '
style = 'fg:101'

[jobs]
symbol = "\uF013"
style = 'fg:70'
symbol_threshold = 1
number_threshold = 1000000
format = '[$symbol$number]($style) '

[username]
format = '[$user]($style)'
style_user = 'fg:180'
style_root = 'bold fg:178'

[hostname]
format = '[@$hostname]($style) '
style = 'fg:180'

[env_var.VIMRUNTIME]
format = "[\uE62B]($style) "
style = 'fg:34'

# Language versions: p10k's nerd-font icons and per-tool colors.
[python]
detect_extensions = []
detect_files = []
detect_folders = []
symbol = "\uE73C "
format = '[${symbol}$virtualenv ]($style)'
style = 'fg:37'

[conda]
symbol = "\uE73C "
format = '[$symbol$environment]($style) '
style = 'fg:37'

[nodejs]
symbol = "\uE617 "
format = '[$symbol($version )]($style)'
version_format = '${raw}'
style = 'fg:70'

[rust]
symbol = "\uE7A8 "
format = '[$symbol($version )]($style)'
version_format = '${raw}'
style = 'fg:37'

[golang]
symbol = "\uE626 "
format = '[$symbol($version )]($style)'
version_format = '${raw}'
style = 'fg:37'

[java]
symbol = "\uE738 "
format = '[$symbol($version )]($style)'
version_format = '${raw}'
style = 'fg:32'

