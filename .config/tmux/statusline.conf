# Status line is drawn by tmux-dotbar (loaded through TPM at the end of
# tmux.conf); this file only feeds it options, so it must be sourced before
# TPM runs. Colors are the starship prompt's palette
# (~/.config/starship/base.toml): 39 for what is current, 31 for borders and
# highlights, 180 for user@host, 242/246 for chrome.
#
# bg is "terminal", not the Konsole scheme's #2c2c2c: the Yakuake profile is
# 90% opaque, and an explicit RGB background would paint the bar as a solid
# strip. Not "default" either: dotbar also uses bg as the text color on its
# filled blocks (prefix pill, bell), and in a status format "default" means
# status-style's fg (the dim colour242), while "terminal" means the terminal's
# own foreground. The fill colors below are dark enough to carry that light
# text.

set-option -g @tmux-dotbar-bg "terminal"
set-option -g @tmux-dotbar-fg "colour242"
set-option -g @tmux-dotbar-fg-current "colour39"
set-option -g @tmux-dotbar-fg-session "colour246"
set-option -g @tmux-dotbar-fg-prefix "colour31"
set-option -g @tmux-dotbar-bold-current-window true

set-option -g @tmux-dotbar-right true
set-option -g @tmux-dotbar-status-right-text " #[fg=colour180]#{user}@#H #[fg=colour242]%H:%M "

set-option -g status-left-length 40
set-option -g status-right-length 80

# dotbar shows no window indexes, so number windows from 1 to match the
# keyboard row.
set-option -g base-index 1
set-option -gw pane-base-index 1
# tmux 3.8 underlines the current window and session by default; dotbar
# marks them by color alone.
set-option -gw window-status-current-style default
set-option -g session-status-current-style default

# Not touched by dotbar.
set-option -gw pane-border-style "fg=colour238"
set-option -gw pane-active-border-style "fg=colour31"
set-option -g message-style "bg=default,fg=colour39"
set-option -g message-command-style "bg=default,fg=colour178"
