# Lean status line matching the starship prompt (~/.config/starship/base.toml):
# no background blocks, everything is told apart by foreground color, and the
# colors are the prompt's palette: 39 bold (repo root) for what is current,
# 31 (directory) for borders, 180 (user@host), 242 (fill) for chrome.
#
# Every style sets fg explicitly. tmux's own status-style default is
# fg=black, and a format that falls back to it is invisible on a dark
# terminal.

set-option -g status-style "bg=default,fg=colour246"
set-option -g status-justify left
set-option -g status-left-length 40
set-option -g status-right-length 80

# Session name turns yellow while the prefix key is pending.
set-option -g status-left "#[bold]#{?client_prefix,#[fg=colour178],#[fg=colour39]} #S #[nobold,fg=colour242]│ "
set-option -g status-right "#[fg=colour180]#{user}@#H #[fg=colour242]%H:%M "

set-option -gw window-status-separator "  "
# #[default] returns to window-status-style, or to the activity/bell style
# while the window has an alert, so the name is what changes color.
set-option -gw window-status-style "fg=colour246"
set-option -gw window-status-format "#[fg=colour242]#I #[default]#W#[fg=colour242]#{window_flags}"
set-option -gw window-status-current-format "#[fg=colour39,bold]#I #W#[nobold]#{?window_zoomed_flag, Z,}"
set-option -gw window-status-activity-style "fg=colour178"
set-option -gw window-status-bell-style "fg=colour160,bold"

set-option -gw pane-border-style "fg=colour238"
set-option -gw pane-active-border-style "fg=colour31"
set-option -g message-style "bg=default,fg=colour39"
set-option -g message-command-style "bg=default,fg=colour178"
