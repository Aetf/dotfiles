# Only settings that differ from tmux 3.8 defaults live here.

set-option -g default-terminal "tmux-256color"
# konsole* is given the same feature set tmux builds into its xterm* default
# (clipboard:ccolour:cstyle:focus:title). tmux has no Konsole entry of its own
# and the konsole-256color terminfo carries no Ss/Se, so without this cstyle
# stays off and tmux swallows the DECSCUSR that nvim sends to switch the cursor
# to a block in normal mode. Only terminal-features turns cstyle on; injecting
# Ss/Se through terminal-overrides has no effect since tmux 3.2.
set-option -ag terminal-features "konsole*:clipboard:ccolour:cstyle:focus:title:extkeys:RGB,*256col*:extkeys:RGB"
# Forward extended keys (kitty keyboard protocol / CSI u) to inner apps that
# request them. terminal-features above only *declares* the outer terminal
# capable; without this switch tmux never uses it, so nvim inside tmux could
# not tell <C-i> from <Tab> (measured 2026-08-16, ucw.nvim Phase 9 D6).
set-option -s extended-keys on
set-option -s escape-time 0
set-option -g focus-events on

# SSH_AUTH_SOCK is deliberately absent: env.d/10-ssh-agent.zsh pins it to the
# fixed symlink ~/.ssh/ssh_auth_sock, so there is nothing per-session left to
# propagate. Listing it here only let tmux cache a dead per-session path from
# whichever client attached first and hand it to every new pane.
set-option -g update-environment "DISPLAY SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"

set-option -g history-limit 50000
set-option -g word-separators " -_@"
# The default follows $EDITOR/$VISUAL; pin it so copy mode is vi everywhere.
set-option -g mode-keys vi
# maintain gapless sequence for a session's window numbers
set-option -g renumber-windows on

set-option -g automatic-rename-format "#{pane_title} #{session_alerts}"
set-option -g set-titles on
set-option -g set-titles-string "#{pane_title} #{session_alerts}"

bind-key v split-window -v -c "#{pane_current_path}"
bind-key h split-window -h -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key H resize-pane -L 5
bind-key L resize-pane -R 5

bind-key M-j resize-pane -D
bind-key M-k resize-pane -U
bind-key M-h resize-pane -L
bind-key M-l resize-pane -R

# Use Alt-vim keys without prefix key to switch panes and windows
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/numToStr/Navigator.nvim
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'M-h' if-shell "$is_vim" 'send-keys M-h'  'select-pane -L'
bind-key -n 'M-j' if-shell "$is_vim" 'send-keys M-j'  'select-pane -D'
bind-key -n 'M-k' if-shell "$is_vim" 'send-keys M-k'  'select-pane -U'
bind-key -n 'M-l' if-shell "$is_vim" 'send-keys M-l'  'select-pane -R'
bind-key -n M-\\ if-shell "$is_vim" "send-keys 'M-\\'"  'select-pane -l'
bind-key -n 'M-p' if-shell "$is_vim" 'send-keys M-p'  'select-window -p'
bind-key -n 'M-n' if-shell "$is_vim" 'send-keys M-n'  'select-window -n'
bind-key -n 'M-|' if-shell "$is_vim" 'send-keys M-|'  'select-window -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Use Ctrl-Alt-n without prefix key to swap windows to next
bind-key -n C-M-n swap-window -t +1

# Fix Ctrl+Left/Right to move around words
unbind-key C-Left
unbind-key C-Right

# Save history to file
bind-key P command-prompt -p 'save history to filename:' -I '~/tmux.history' 'capture-pane -S - ; save-buffer %1 ; delete-buffer'

# Switch pane using fzf
bind-key C-P run-shell -b tmux-switch-pane-fzf

source-file -F "#{d:current_file}/statusline.conf"

# Plugins. TPM must run last: plugins read their @options when they load.
# TPM clones itself (and installs the plugins) on first start of a new
# machine; plugins live in ~/.config/tmux/plugins, outside yadm.
# prefix + I installs newly listed plugins, prefix + U updates them.
set-option -g @plugin "tmux-plugins/tpm"
set-option -g @plugin "vaaleyard/tmux-dotbar"
# The path TPM would pick anyway, set up front because install_plugins in the
# bootstrap below runs before tpm and reads it from the environment.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"
if-shell "test ! -d ~/.config/tmux/plugins/tpm" \
    "run-shell 'git clone -q https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"
run-shell "~/.config/tmux/plugins/tpm/tpm"

# dotbar fills the activity alert with fg-current behind bg-as-text, which
# with bg=terminal is light text on light blue; color the name instead.
set-option -gw window-status-activity-style "fg=colour178"
